name: Deploy

on:
  push:
    tags:
    - '*.*.*'

jobs:
  deploy:
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      SONA_USER: ${{ secrets.SONA_USER }}
      SONA_PASS: ${{ secrets.SONA_PASS }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SONA_PGP_PASSPHRASE }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SONA_PGP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Build
        run: ./gradlew assembleRelease

      - name: Get tag and tracker version information
        id: version
        run: |
          echo "TAG_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
          echo "TRACKER_VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Fail if version mismatch
        if: ${{ steps.version.outputs.TAG_VERSION != steps.version.outputs.TRACKER_VERSION }}
        run: |
          echo "Tag version (${{ steps.version.outputs.TAG_VERSION }}) doesn't match version in project (${{ steps.version.outputs.TRACKER_VERSION }})"
          exit 1

      - name: Publish
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository

      - name: Extract CHANGELOG entry for this version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.TAG_VERSION }}
        run: |
          set -euo pipefail
          # Pull the section for this version: from `Version X.Y.Z (...)` up to
          # (but not including) the next `Version ` header. Drop the
          # `--------` underline row.
          awk -v ver="$VERSION" '
            $0 ~ "^Version " ver " " { found=1; next }
            found && /^Version / { exit }
            found && /^-+$/ { next }
            found { print }
          ' CHANGELOG > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::warning::No CHANGELOG entry found for $VERSION; release notes will be empty"
          fi
          echo "=== Release notes ==="
          cat release-notes.md
          echo "====================="

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.TAG_VERSION }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; updating notes."
            gh release edit "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file release-notes.md
          fi
